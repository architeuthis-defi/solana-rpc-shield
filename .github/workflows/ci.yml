name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
      # Evidence artifact, not a gate: the table's counts are deterministic,
      # but medians carry timer jitter and loaded CI runners can starve the
      # in-process servers — a flaky runner must not block a green build.
      - run: npm run sim:landing
        continue-on-error: true
